name: Actual embedding async checkpoint comparison
on:
  push:
    branches: [bench/async-checkpoint-suite]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: async-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out actual pinned application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ieee0824/omoikane
          ref: 007556adccb8fb4329236932ca8175f8e8d119d2
          path: omoikane
          persist-credentials: false
      - name: Prepare compiler and evidence
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          mkdir "$RUNNER_TEMP/results"
          rustc -Vv > "$RUNNER_TEMP/results/compiler.txt"
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$RUNNER_TEMP/results/measured-revision.txt"
      - name: Build real release workers before timing
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/temiya-target" cargo build --locked --release --example measure_async_workload
          node scripts/build-omoikane-worker.mjs "$GITHUB_WORKSPACE/omoikane" "$RUNNER_TEMP/boa-build" "$RUNNER_TEMP/boa-target" async
          cp "$RUNNER_TEMP/boa-build/build-info.json" "$RUNNER_TEMP/results/boa-build-info.json"
      - name: Freeze authored inputs and exercise actual adapters
        run: |
          node scripts/extract-async-workloads.mjs "$RUNNER_TEMP/inputs"
          cp "$RUNNER_TEMP/inputs/manifest.json" "$RUNNER_TEMP/results/manifest.json"
          node scripts/check-async-workers.mjs "$RUNNER_TEMP/temiya-target/release/examples/measure_async_workload" "$RUNNER_TEMP/boa-target/release/omoikane-workload-worker" > "$RUNNER_TEMP/results/worker-checks.json"
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const root=process.env.RUNNER_TEMP;
          const executable=path.join(root,'temiya-target/release/examples/measure_async_workload');
          const hash=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          fs.writeFileSync(path.join(root,'results/temiya-build-info.json'),JSON.stringify({
            revision:fs.readFileSync(path.join(root,'results/measured-revision.txt'),'utf8').trim(),
            executable,executable_sha256:hash(executable),source_sha256:hash('examples/measure_async_workload.rs'),
            cargo_lock_sha256:hash('Cargo.lock'),profile:'release',features:[],cargo_args:['build','--locked','--release','--example','measure_async_workload'],
            rustc:fs.readFileSync(path.join(root,'results/compiler.txt'),'utf8').trim()
          },null,2)+'\n');
          JS
      - name: Measure scheduling and checkpoints serially
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/results/measured-revision.txt")"
          export BENCH_NOTES='Authored async inputs separate from original11; actual public Engine/drain_jobs and pinned application JsRuntime/run_jobs. Same compiler, all builds and worker checks completed before serial timing. No GC-completeness or full async conformance claim.'
          node scripts/compare-async-workloads.mjs "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/temiya-target/release/examples/measure_async_workload" "$RUNNER_TEMP/results/boa-build-info.json" 15 3 > "$RUNNER_TEMP/results/async.json" 2> "$RUNNER_TEMP/results/async.progress"
      - name: Retain valid and failed observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: async-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          if-no-files-found: error
          retention-days: 30
