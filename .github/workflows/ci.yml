name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-abi:
    name: C ABI header, example, and symbols
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Verify C ABI
        run: bash scripts/check-c-abi

  quality:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust with quality tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Verify retained native differential observations
        run: node benchmarks/native-differential/verify.mjs
      - name: Verify initial class performance evidence including slower results
        run: node benchmarks/base-classes/verify-initial.mjs
      - name: Verify intermediate class optimization evidence including slower results
        run: node benchmarks/base-classes/verify-auto-functions.mjs
      - name: Verify private lexical class optimization and raw original suites
        run: node benchmarks/base-classes/verify-lexical.mjs
      - name: Verify retained hosted class slowdowns and full-corpus regression
        run: |
          node benchmarks/base-classes/verify-native-loop.mjs
          node benchmarks/base-classes/verify-native-originals.mjs
          node benchmarks/base-classes/verify-loop-originals.mjs
          node benchmarks/base-classes/verify-hosted-f1c.mjs
          node benchmarks/base-classes/verify-hosted-loop.mjs
          node benchmarks/derived-classes/verify-initial.mjs
          node benchmarks/derived-classes/verify-arguments.mjs
          node benchmarks/derived-classes/verify-native-prototypes.mjs
          node benchmarks/derived-classes/verify-dependencies.mjs
          node benchmarks/derived-classes/verify-full.mjs
          node benchmarks/derived-classes/verify-view-index.mjs
          node benchmarks/derived-classes/verify-delegation.mjs
          node benchmarks/derived-classes/verify-anonymous-env.mjs
          node benchmarks/derived-classes/verify-function-metadata.mjs
          node benchmarks/derived-classes/verify-class-bridge.mjs
          node benchmarks/derived-classes/verify-hosted.mjs
          node benchmarks/base-classes/verify-full-f1c.mjs
          node benchmarks/base-classes/verify-full-loop.mjs
          node benchmarks/test262-asan-compat/verify.mjs
      - name: Check external benchmark adapter formatting
        run: rustfmt +stable --edition 2024 --check benchmarks/omoikane-worker/main.rs
      - name: Check authored RegExp input contracts
        run: node scripts/check-regexp-workloads.mjs
      - name: Validate structured differential observation protocol
        run: node --test tests/differential-observation.test.mjs
      - name: Check Test262 regression policy boundaries
        run: |
          node --test tests/test262-regression-policy.test.mjs
          node benchmarks/test262-regression-gate/verify.mjs
      - name: Verify retained fresh RegExp evidence
        run: node benchmarks/regexp-cold-ascii/verify-integrity.mjs
      - name: Verify retained full Test262 baseline and collection history
        run: node scripts/verify-test262-archive.mjs benchmarks/test262-feature-baseline
      - name: Verify original arithmetic Intel instruction evidence
        run: node benchmarks/intel-arithmetic/verify.mjs
      - name: Verify checked component records and rejection gates
        run: |
          node benchmarks/components/verify-integrity.mjs
          node scripts/check-component-records.mjs
      - name: Run Clippy
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test and build (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, '1.85.0']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
      - name: Test
        run: cargo +${{ matrix.toolchain }} test --locked --all-features
      - name: Build
        run: cargo +${{ matrix.toolchain }} build --locked --all-features
      - name: Verify documented execution paths
        run: cargo +${{ matrix.toolchain }} run --locked --example backend_scope --all-features
      - name: Require public handle safety and runtime cycle reclamation
        run: cargo +${{ matrix.toolchain }} run --locked --release --example ownership_probe -- --require-reclamation
      - name: Verify benchmark worker result validation
        run: |
          cargo +${{ matrix.toolchain }} build --locked --release --no-default-features --example measure_workload
          node scripts/check-workload-workers.mjs target/release/examples/measure_workload
          sha256sum target/release/examples/measure_workload
      - name: Verify checked component worker contracts
        run: |
          cargo +${{ matrix.toolchain }} build --locked --release --no-default-features --example measure_components
          node scripts/check-component-workers.mjs target/release/examples/measure_components
      - name: Verify runtime string allocation budgets
        run: |
          cargo +${{ matrix.toolchain }} run --locked --release --example string_allocation_probe > target/string-allocations.json
          node scripts/check-string-allocations.mjs target/string-allocations.json
      - name: Verify numeric normalization allocation budgets
        run: |
          cargo +${{ matrix.toolchain }} run --locked --release --example numeric_allocation_probe > target/numeric-allocations.json
          node scripts/check-numeric-allocations.mjs target/numeric-allocations.json
      - name: Fetch pinned Test262 regression corpus
        run: scripts/test262
      - name: Execute unchanged core class originals with explicit dependency failures
        env:
          CLASS_FIXTURE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CLASS_TEST_RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: node scripts/test-base-class-originals.mjs target/debug/temiya-test262 target/test262 target/base-class-originals
      - name: Preserve core class original captures and inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-class-originals-${{ matrix.toolchain }}
          path: target/base-class-originals
          if-no-files-found: error
          retention-days: 30
      - name: Exercise regression gate through actual pinned Engine captures
        run: node scripts/test-test262-regression-gate.mjs target/debug/temiya-test262 target/test262 target/test262-gate-integration
      - name: Preserve regression gate integration captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test262-gate-integration-${{ matrix.toolchain }}
          path: target/test262-gate-integration
          if-no-files-found: error
          retention-days: 30
      - name: Exercise real CLI collection recovery without replacing known outcomes
        run: node scripts/test-test262-recovery.mjs target/debug/temiya-test262 target/test262 target/test262-recovery-integration
      - name: Preserve collector recovery integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test262-recovery-integration-${{ matrix.toolchain }}
          path: target/test262-recovery-integration
          if-no-files-found: error
          retention-days: 30
      - name: Run original Test262 cases through the shell
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test cli pinned_test262_through_actual_shell --all-features -- --ignored --nocapture
      - name: Run original Test262 cases through the Engine runner
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test test262_engine pinned_ --all-features -- --ignored --nocapture
      - name: Run original Test262 async completion cases
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test test262_async pinned_ --all-features -- --ignored --nocapture
      - name: Run original var-binding resolution regression
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test bytecode_operators pinned_test262_var_binding_resolution --all-features -- --ignored --nocapture
      - name: Run original array-literal regressions
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test bytecode_arrays pinned_test262_array_literals --all-features -- --ignored --nocapture
      - name: Run original object-initializer prototype regressions
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test bytecode_objects pinned_test262_object_prototypes --all-features -- --ignored --nocapture
      - name: Run upstream exception regressions
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test exception_flow pinned_test262_exception_regressions --all-features -- --ignored --nocapture
      - name: Run upstream async rejection-value regressions
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test promise_rejection_values pinned_test262_async_rejection_values --all-features -- --ignored --nocapture
      - name: Run upstream RegExp construction and capture regressions
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test regexp_compilation_cache pinned_test262_regexp_compilation --all-features -- --ignored --nocapture
      - name: Run upstream typed Number dispatch regressions
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test typed_number_dispatch pinned_test262_typed_number_dispatch --all-features -- --ignored --nocapture
      - name: Run upstream array stack regressions
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test array_stack pinned_test262_array_stack --all-features -- --ignored --nocapture
      - name: Run upstream array element regressions
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test array_stack pinned_test262_array_elements --all-features -- --ignored --nocapture
      - name: Run upstream string method regressions
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test string_methods pinned_test262_string_methods --all-features -- --ignored --nocapture
      - name: Run upstream function prototype regressions
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test function_allocation pinned_test262_function_prototypes --all-features -- --ignored --nocapture
      - name: Run upstream addition conversion regressions
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test addition_coercion pinned_test262_addition_coercion --all-features -- --ignored --nocapture
      - name: Run upstream bytecode scope regressions
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test bytecode_scopes pinned_test262_bytecode_scope_tdz --all-features -- --ignored --nocapture
      - name: Run upstream global declaration regressions
        env:
          TEST262_DIR: target/test262
        run: cargo +${{ matrix.toolchain }} test --locked --test global_declarations pinned_test262_global_declarations --all-features -- --ignored --nocapture
      - name: Run original bytecode loop audit and check scoped regressions
        env:
          TEST262_DIR: target/test262
          TEST262_REPORT: target/bytecode-loops.json
        run: |
          loop_audit_status=0
          cargo +${{ matrix.toolchain }} test --locked --test bytecode_loops pinned_test262_bytecode_loops --all-features -- --ignored --nocapture || loop_audit_status=$?
          node scripts/check-bytecode-loop-audit.mjs target/bytecode-loops.json "$loop_audit_status"
