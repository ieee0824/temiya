name: Direct HIR cold unique RegExp instruction diagnostic
on:
  push:
    branches: [bench/integer-dispatch-profile]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regexp-cold-hir-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_DEBUG: 1
      RUSTFLAGS: -C dwarf-version=4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          rustup toolchain install stable --profile minimal
          rustup default stable
          mkdir "$RUNNER_TEMP/profile"
          rustc -Vv > "$RUNNER_TEMP/profile/rustc.txt"
          valgrind --version > "$RUNNER_TEMP/profile/valgrind.txt"
          lscpu > "$RUNNER_TEMP/profile/machine.txt"
      - name: Build optimized diagnostic worker with line tables
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/target" cargo build --locked --release --no-default-features --example measure_workload
      - name: Prepare unchanged cold unique construction input
        run: |
          cp "benchmarks/regexp-cache/cold-unique/input.json" "$RUNNER_TEMP/profile/diagnostic-input.json"
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
          const root=process.env.RUNNER_TEMP,hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const bytes=fs.readFileSync(path.join(root,'profile/diagnostic-input.json')),input=JSON.parse(bytes);
          if(input.name!=='regexp-cold-unique-diagnostic'||input.iterations!==2048||input.expected!==2048*(8+5+2)||input.invocation!=='uniqueRegexpBody(2048);')throw Error('authored construction contract changed');
          const executable=path.join(root,'target/release/examples/measure_workload');
          fs.writeFileSync(path.join(root,'profile/provenance.json'),JSON.stringify({
            measured_revision:cp.execFileSync('git',['-c','safe.directory='+process.env.GITHUB_WORKSPACE,'-C',process.env.GITHUB_WORKSPACE,'rev-parse','HEAD'],{encoding:'utf8'}).trim(),
            qualifier:'DIAGNOSTIC ONLY: unchanged cold unique 2048 iterations under instrumentation; never a speed acceptance result',
            input_sha256:hash(bytes),setup_sha256:hash(input.setup),invocation_sha256:hash(input.invocation),iterations:2048,independent_expected:2048*(8+5+2),
            executable_sha256:hash(fs.readFileSync(executable)),
            build:{profile:'release',features:[],release_debug:1,rustflags:process.env.RUSTFLAGS},
            scope:'Whole instrumented process, including startup/setup, one checked warmup and one checked pass; instruction references are not hardware cycles or valid elapsed-time comparisons'
          },null,2)+'\n');
          JS
      - name: Collect actual instruction and call counts
        run: |
          valgrind --tool=callgrind --dump-instr=yes --collect-jumps=yes --callgrind-out-file="$RUNNER_TEMP/profile/callgrind.out" "$RUNNER_TEMP/target/release/examples/measure_workload" "$RUNNER_TEMP/profile/diagnostic-input.json" 1 > "$RUNNER_TEMP/profile/instrumented-worker-output.json" 2> "$RUNNER_TEMP/profile/valgrind.log"
          callgrind_annotate --inclusive=no --auto=yes "$RUNNER_TEMP/profile/callgrind.out" > "$RUNNER_TEMP/profile/exclusive.txt"
          callgrind_annotate --inclusive=yes --tree=both --auto=yes "$RUNNER_TEMP/profile/callgrind.out" > "$RUNNER_TEMP/profile/inclusive.txt"
      - name: Retain diagnostic evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: regexp-cold-hir-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/profile
          if-no-files-found: error
          retention-days: 30
