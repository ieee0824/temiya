name: Runtime dispatch diagnostics
on:
  push:
    branches: [bench/integer-dispatch-profile]
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Diagnostic suite; instrumented results never qualify native speed
        type: choice
        options: [arithmetic, managed-numeric-storage]
        default: arithmetic
      measured_revision:
        description: Full measured commit for managed storage diagnosis
        type: string
        default: 6fb3160be6d966b7b0c35fb7b5da06ddb33b3583
      baseline_revision:
        description: Full reference commit for managed storage diagnosis
        type: string
        default: c7c4f265c4002de1d90223eccaa64aaafdada52a
      workloads:
        description: Optional comma-separated original workload names; empty retains the three managed-storage diagnostics
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: integer-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic != 'managed-numeric-storage'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_DEBUG: 1
      RUSTFLAGS: -C dwarf-version=4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out pinned workload source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ieee0824/omoikane
          ref: 007556adccb8fb4329236932ca8175f8e8d119d2
          path: omoikane
          persist-credentials: false
      - name: Prepare diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          rustup toolchain install stable --profile minimal
          rustup default stable
          mkdir "$RUNNER_TEMP/profile"
          rustc -Vv > "$RUNNER_TEMP/profile/rustc.txt"
          valgrind --version > "$RUNNER_TEMP/profile/valgrind.txt"
          lscpu > "$RUNNER_TEMP/profile/machine.txt"
      - name: Build optimized diagnostic worker with line tables
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/target" cargo build --locked --release --example measure_workload
      - name: Prepare separately labelled reduced diagnostic input
        run: |
          node scripts/extract-omoikane-workloads.mjs "$GITHUB_WORKSPACE/omoikane" "$RUNNER_TEMP/original"
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
          const root=process.env.RUNNER_TEMP;
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const original=fs.readFileSync(path.join(root,'original/arith.json'));
          const input=JSON.parse(original);
          const oracle=n=>{let s=1n;for(let i=0n;i<BigInt(n);i++)s=(s+i*3n)%1000003n;return Number(s);};
          if(input.iterations!==2000000||input.expected!==64||oracle(input.iterations)!==input.expected||input.invocation!=='__temiyaBenchmarkBody(2000000);\n')throw Error('original arithmetic fixture changed');
          const n=20000;
          input.iterations=n;input.expected=oracle(n);input.invocation=`__temiyaBenchmarkBody(${n});\n`;
          input.original_invocation_sha256=input.invocation_sha256;
          input.invocation_sha256=hash(input.invocation);
          input.qualification='DIAGNOSTIC ONLY: reduced iterations and instrumented execution, never a performance acceptance result';
          fs.writeFileSync(path.join(root,'profile/diagnostic-input.json'),JSON.stringify(input,null,2)+'\n');
          const executable=path.join(root,'target/release/examples/measure_workload');
          fs.writeFileSync(path.join(root,'profile/provenance.json'),JSON.stringify({
            measured_revision:cp.execFileSync('git',['-c',`safe.directory=${process.env.GITHUB_WORKSPACE}`,'-C',process.env.GITHUB_WORKSPACE,'rev-parse','HEAD'],{encoding:'utf8'}).trim(),
            qualifier:input.qualification,original_input_sha256:hash(original),original_iterations:2000000,diagnostic_iterations:n,
            unchanged_setup_sha256:hash(input.setup),diagnostic_expected:input.expected,executable_sha256:hash(fs.readFileSync(executable)),
            build:{profile:'release',features:[],release_debug:1,rustflags:process.env.RUSTFLAGS},
            scope:'Whole instrumented process, including startup/setup, one checked warmup and one checked pass; instruction counts are not hardware cycles or valid elapsed-time comparisons'
          },null,2)+'\n');
          JS
      - name: Collect actual instruction and call counts
        run: |
          valgrind --tool=callgrind --dump-instr=yes --collect-jumps=yes --callgrind-out-file="$RUNNER_TEMP/profile/callgrind.out" "$RUNNER_TEMP/target/release/examples/measure_workload" "$RUNNER_TEMP/profile/diagnostic-input.json" 1 > "$RUNNER_TEMP/profile/instrumented-worker-output.json" 2> "$RUNNER_TEMP/profile/valgrind.log"
          callgrind_annotate --inclusive=no --auto=yes "$RUNNER_TEMP/profile/callgrind.out" > "$RUNNER_TEMP/profile/exclusive.txt"
          callgrind_annotate --inclusive=yes --tree=both --auto=yes "$RUNNER_TEMP/profile/callgrind.out" > "$RUNNER_TEMP/profile/inclusive.txt"
      - name: Retain diagnostic evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: integer-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/profile
          if-no-files-found: error
          retention-days: 30

  managed-storage:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic == 'managed-numeric-storage'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      EXPECTED_MEASURED: ${{ inputs.measured_revision }}
      EXPECTED_BASELINE: ${{ inputs.baseline_revision }}
      DIAGNOSTIC_WORKLOADS: ${{ inputs.workloads }}
    defaults:
      run:
        working-directory: profile-tools
        shell: bash
    steps:
      - name: Check out profiling tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: profile-tools
          persist-credentials: false
      - name: Check out measured runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.measured_revision }}
          path: temiya-current
          persist-credentials: false
      - name: Check out reference runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.baseline_revision }}
          path: temiya-baseline
          persist-credentials: false
      - name: Check out pinned workload source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ieee0824/omoikane
          ref: 007556adccb8fb4329236932ca8175f8e8d119d2
          path: omoikane
          persist-credentials: false
      - name: Prepare diagnostic tools and original fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind binutils
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          mkdir "$RUNNER_TEMP/numeric-profile"
          node scripts/extract-omoikane-workloads.mjs "$GITHUB_WORKSPACE/omoikane" "$RUNNER_TEMP/original"
      - name: Build unchanged release workers
        run: |
          cargo build --manifest-path ../temiya-baseline/Cargo.toml --locked --release --no-default-features --example measure_workload --target-dir "$RUNNER_TEMP/baseline-target" > "$RUNNER_TEMP/numeric-profile/baseline-build.log" 2>&1
          cargo build --manifest-path ../temiya-current/Cargo.toml --locked --release --no-default-features --example measure_workload --target-dir "$RUNNER_TEMP/measured-target" > "$RUNNER_TEMP/numeric-profile/measured-build.log" 2>&1
      - name: Diagnose selected original workloads
        run: node scripts/profile-managed-number-regressions.mjs "$GITHUB_WORKSPACE/temiya-baseline" "$GITHUB_WORKSPACE/temiya-current" "$RUNNER_TEMP/original" "$RUNNER_TEMP/numeric-profile" "$RUNNER_TEMP/baseline-target" "$RUNNER_TEMP/measured-target" "$DIAGNOSTIC_WORKLOADS"
      - name: Retain complete diagnostics including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: managed-storage-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/numeric-profile
          if-no-files-found: error
          retention-days: 30
