name: Intel 6973 original arithmetic instruction profile
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: intel6973-key-eq-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    name: Profile requested Intel, probe ${{ matrix.copy }}
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: temiya
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_DEBUG: 1
      RUSTFLAGS: -C dwarf-version=4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: temiya
          persist-credentials: false
      - name: Record requested hardware before building
        id: hardware
        run: |
          mkdir -p "$RUNNER_TEMP/profile"
          node <<'JS'
          const fs=require("node:fs"),os=require("node:os"),path=require("node:path");
          const models=[...new Set(os.cpus().map(c=>c.model))];
          const matches=os.arch()==="x64"&&models.length>0&&models.every(m=>m.includes("6973P-C"));
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,"profile/hardware.json"),JSON.stringify({
            requested_cpu:"6973P-C",observed_cpu_models:models,architecture:os.arch(),
            logical_cpus:os.cpus().length,target_available:matches,
            qualification:matches?"Requested hardware available; instruction data still required":"Unavailable hardware; no profile or speed acceptance"
          },null,2)+"\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT,"matches="+matches+"\n");
          JS
      - name: Check out fixed current-main baseline
        if: steps.hardware.outputs.matches == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 56164251391bea02c75bb1d8bbf2483dc03545ee
          path: temiya-baseline
          persist-credentials: false
      - name: Check out original input source without replacing its engine
        if: steps.hardware.outputs.matches == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ieee0824/omoikane
          ref: 007556adccb8fb4329236932ca8175f8e8d119d2
          path: omoikane
          persist-credentials: false
      - name: Prepare instruction diagnostic tools
        if: steps.hardware.outputs.matches == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv > "$RUNNER_TEMP/profile/rustc.txt"
          valgrind --version > "$RUNNER_TEMP/profile/valgrind.txt"
          lscpu > "$RUNNER_TEMP/profile/machine.txt"
          ldd --version > "$RUNNER_TEMP/profile/libc.txt"
      - name: Build both optimized diagnostic workers with line tables
        if: steps.hardware.outputs.matches == 'true'
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/profile-current-target" cargo build --locked --release --no-default-features --example measure_workload
          CARGO_TARGET_DIR="$RUNNER_TEMP/profile-baseline-target" cargo build --manifest-path "$GITHUB_WORKSPACE/temiya-baseline/Cargo.toml" --locked --release --no-default-features --example measure_workload
      - name: Extract exact original arithmetic and independent integer oracle
        if: steps.hardware.outputs.matches == 'true'
        run: |
          node scripts/extract-omoikane-workloads.mjs "$GITHUB_WORKSPACE/omoikane" "$RUNNER_TEMP/profile/workloads"
          node <<'JS'
          const fs=require("node:fs"),path=require("node:path"),crypto=require("node:crypto"),cp=require("node:child_process");
          const root=process.env.RUNNER_TEMP,out=path.join(root,"profile"),ws=process.env.GITHUB_WORKSPACE;
          const hash=b=>crypto.createHash("sha256").update(b).digest("hex");
          const manifest=JSON.parse(fs.readFileSync(path.join(out,"workloads/manifest.json")));
          const bytes=fs.readFileSync(path.join(out,"workloads/arith.json")),input=JSON.parse(bytes),entry=manifest.workloads.find(w=>w.name==="arith");
          let answer=0n;for(let i=0n;i<2000000n;i++)answer=(answer+i*3n)%1000003n;
          if(manifest.revision!=="007556adccb8fb4329236932ca8175f8e8d119d2"||manifest.fixture_version!==2||
             manifest.fixture_sha256!=="177eb80ae73d1081eb620f747b4703e2a9f2731e0255bb60131b73b7dcac6464"||
             input.iterations!==2000000||input.expected!==64||answer!==64n||
             input.name!=="arith"||entry.setup_sha256!==hash(input.setup)||entry.invocation_sha256!==hash(input.invocation))throw Error("original arithmetic contract changed");
          fs.writeFileSync(path.join(out,"arith-input.json"),bytes);
          const workers={};
          for(const label of ["baseline","current"]){
            const checkout=path.join(ws,label==="current"?"temiya":"temiya-baseline"),executable=path.join(root,"profile-"+label+"-target/release/examples/measure_workload");
            workers[label]={revision:cp.execFileSync("git",["-c","safe.directory="+checkout,"-C",checkout,"rev-parse","HEAD"],{encoding:"utf8"}).trim(),
              executable_sha256:hash(fs.readFileSync(executable)),profile:"release",features:[],release_debug:1,rustflags:process.env.RUSTFLAGS};
          }
          fs.writeFileSync(path.join(out,"provenance.json"),JSON.stringify({
            qualifier:"INSTRUCTION DIAGNOSTIC ONLY; not native elapsed-speed qualification",
            workers,input_sha256:hash(bytes),setup_sha256:hash(input.setup),invocation_sha256:hash(input.invocation),
            iterations:2000000,independent_expected:Number(answer),
            scope:"Whole process including startup/setup and two complete original arithmetic passes (one checked warmup, one checked sample). Instruction references are not hardware cycles or CPU-specific elapsed shares."
          },null,2)+"\n");
          JS
      - name: Profile complete original input on both actual workers
        if: steps.hardware.outputs.matches == 'true'
        run: |
          for label in baseline current; do
            valgrind --tool=callgrind --dump-instr=yes --collect-jumps=yes --callgrind-out-file="$RUNNER_TEMP/profile/$label-callgrind.out" "$RUNNER_TEMP/profile-$label-target/release/examples/measure_workload" "$RUNNER_TEMP/profile/arith-input.json" 1 > "$RUNNER_TEMP/profile/$label-worker-output.json" 2> "$RUNNER_TEMP/profile/$label-valgrind.log"
            callgrind_annotate --inclusive=no --auto=yes "$RUNNER_TEMP/profile/$label-callgrind.out" > "$RUNNER_TEMP/profile/$label-exclusive.txt"
            callgrind_annotate --inclusive=yes --tree=both --auto=yes "$RUNNER_TEMP/profile/$label-callgrind.out" > "$RUNNER_TEMP/profile/$label-inclusive.txt"
          done
          node <<'JS'
          const fs=require("node:fs"),path=require("node:path");
          const out=path.join(process.env.RUNNER_TEMP,"profile");
          for(const label of ["baseline","current"]){
            const m=JSON.parse(fs.readFileSync(path.join(out,label+"-worker-output.json")));
            if(m.expected!==64||m.validated_passes!==2||m.samples_ns.length!==1||
               m.setup_backend!=="Bytecode"||m.invocation_backend!=="Bytecode"||m.profile!=="release")throw Error("instrumented result/backend mismatch "+label);
          }
          fs.writeFileSync(path.join(out,"verification.json"),JSON.stringify({checked_results:4,expected:64,
            original_iterations:2000000,qualification:"Two validated instrumented passes per worker; no elapsed-speed gate"},null,2)+"\n");
          JS
      - name: Retain every requested-hardware observation including unavailable probes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: intel6973-key-eq-profile-${{ github.run_id }}-${{ github.run_attempt }}-copy-${{ matrix.copy }}
          path: ${{ runner.temp }}/profile
          if-no-files-found: error
          retention-days: 30
