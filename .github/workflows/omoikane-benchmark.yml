name: Exact cold unique RegExp comparison

on:
  workflow_dispatch:
    inputs:
      baseline_revision:
        description: Temiya revision to compare against
        default: main
        type: string
      include_controls:
        description: Also compare baseline with Boa and candidate with itself
        default: false
        type: boolean
      two_runners:
        description: Record two independent hosted machines without selecting a CPU
        default: false
        type: boolean
      required_cpu_model:
        description: Optional CPU-model substring; unavailable hardware is not a measurement pass
        default: ''
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: omoikane-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'benchmark-omoikane'
    name: Record comparisons, copy ${{ matrix.copy }} (speed gates separate)
    strategy:
      fail-fast: false
      matrix:
        copy: ${{ fromJSON(inputs.two_runners && '[1,2]' || '[1]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: temiya
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      INCLUDE_CONTROLS: 'true'
      REQUIRED_CPU_MODEL: ${{ inputs.required_cpu_model || '' }}
    steps:
      - name: Check out measured revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: temiya
          persist-credentials: false
      - name: Record hardware availability before building
        id: hardware
        run: |
          mkdir -p "$RUNNER_TEMP/comparison-output"
          node <<'JS'
          const fs=require('node:fs'),os=require('node:os'),path=require('node:path');
          const required=process.env.REQUIRED_CPU_MODEL ?? '';
          const models=[...new Set(os.cpus().map(c=>c.model))];
          const matches=required==='' || (models.length>0 && models.every(m=>m.includes(required)));
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'comparison-output/hardware-availability.json'),JSON.stringify({required_cpu_model:required,observed_cpu_models:models,target_available:matches,qualification:matches?'Requested hardware available; actual measurement results still required':'Requested hardware unavailable; no speed or correctness pass'},null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`matches=${matches}\n`);
          JS
      - name: Check out baseline revision
        if: steps.hardware.outputs.matches == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseline_revision || github.event.pull_request.base.sha || 'main' }}
          path: temiya-baseline
          persist-credentials: false
      - name: Check out pinned application
        if: steps.hardware.outputs.matches == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ieee0824/omoikane
          ref: 007556adccb8fb4329236932ca8175f8e8d119d2
          path: omoikane
          persist-credentials: false
      - name: Prepare compiler and output directory
        if: steps.hardware.outputs.matches == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          mkdir -p "$RUNNER_TEMP/comparison-output"
          git -c safe.directory="$GITHUB_WORKSPACE/temiya" -C "$GITHUB_WORKSPACE/temiya" rev-parse HEAD > "$RUNNER_TEMP/comparison-output/measured-revision.txt"
          git -c safe.directory="$GITHUB_WORKSPACE/temiya-baseline" -C "$GITHUB_WORKSPACE/temiya-baseline" rev-parse HEAD > "$RUNNER_TEMP/comparison-output/baseline-revision.txt"
          rustc -Vv > "$RUNNER_TEMP/comparison-output/compiler.txt"
      - name: Build both Temiya workers with isolated targets
        if: steps.hardware.outputs.matches == 'true'
        run: |
          cargo build --locked --release --no-default-features --example measure_workload --target-dir "$RUNNER_TEMP/temiya-current-target"
          cargo build --manifest-path ../temiya-baseline/Cargo.toml --locked --release --no-default-features --example measure_workload --target-dir "$RUNNER_TEMP/temiya-baseline-target"
          node <<'JS'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const path = require('node:path');
          const checkout = path.resolve('../temiya-baseline');
          const executable = path.join(process.env.RUNNER_TEMP, 'temiya-baseline-target/release/examples/measure_workload');
          const git = args => execFileSync('git', ['-c', `safe.directory=${checkout}`, '-C', checkout, ...args], { encoding: 'utf8' }).trim();
          if (git(['status', '--porcelain']) !== '') throw Error('baseline checkout changed');
          const probePath = path.join(process.env.RUNNER_TEMP, 'temiya-mode-probe.json');
          fs.writeFileSync(probePath, JSON.stringify({name:'mode-probe',setup:'',invocation:'40+2;',expected:42,iterations:1}));
          const probe = JSON.parse(execFileSync(executable, [probePath, '1'], {encoding:'utf8',timeout:60000}));
          if (!['AST interpreter','Auto Script','Auto Script+loop'].includes(probe.mode) || probe.validated_passes !== 2) throw Error('baseline mode probe failed');
          const info = {
            name: 'Temiya', engine: 'Temiya', mode: probe.mode, profile: 'release', features: [], mode_probe: probe,
            revision: git(['rev-parse', 'HEAD']), executable,
            executable_sha256: createHash('sha256').update(fs.readFileSync(executable)).digest('hex'),
            rustc: execFileSync('rustc', ['-Vv'], { encoding: 'utf8' }).trim(),
          };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'comparison-output/baseline-build-info.json'), JSON.stringify(info, null, 2) + '\n');
          if (process.env.INCLUDE_CONTROLS === 'true') {
            if (info.mode !== 'Auto Script') throw Error('optional baseline/Boa control requires an Auto Script baseline');
            const current = path.join(process.env.RUNNER_TEMP, 'temiya-current-target/release/examples/measure_workload');
            const observed = JSON.parse(execFileSync(current, [probePath, '1'], {encoding:'utf8',timeout:60000}));
            if (observed.mode !== 'Auto Script' || observed.validated_passes !== 2) throw Error('current mode probe failed');
            const source = path.resolve('.');
            const revision = execFileSync('git', ['-c', `safe.directory=${source}`, '-C', source, 'rev-parse','HEAD'], {encoding:'utf8'}).trim();
            const control = {...info, mode:observed.mode, mode_probe:observed, revision, executable:current,
              executable_sha256:createHash('sha256').update(fs.readFileSync(current)).digest('hex'),
              qualification:'Same executable used by both worker labels; this diagnoses variability, never a source speedup'};
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'comparison-output/same-binary-build-info.json'),JSON.stringify(control,null,2)+'\n');
          }
          JS
      - name: Build actual pinned omoikane embedding
        if: steps.hardware.outputs.matches == 'true'
        run: |
          node scripts/build-omoikane-worker.mjs "$GITHUB_WORKSPACE/omoikane" "$RUNNER_TEMP/omoikane-worker-build" "$RUNNER_TEMP/omoikane-worker-target"
          cp "$RUNNER_TEMP/omoikane-worker-build/build-info.json" "$RUNNER_TEMP/comparison-output/boa-build-info.json"
      - name: Record current build metadata
        if: steps.hardware.outputs.matches == 'true'
        run: |
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path');
          const dir=path.join(process.env.RUNNER_TEMP,'comparison-output');
          const info=JSON.parse(fs.readFileSync(path.join(dir,'same-binary-build-info.json')));
          delete info.qualification;
          fs.writeFileSync(path.join(dir,'current-build-info.json'),JSON.stringify(info,null,2)+'\n');
          JS
      - name: Measure exact fresh pattern input and all three real workers
        if: steps.hardware.outputs.matches == 'true'
        run: |
          node scripts/measure-regexp-cold-diagnostic.mjs "$RUNNER_TEMP/comparison-output/current-build-info.json" "$RUNNER_TEMP/comparison-output/baseline-build-info.json" "$RUNNER_TEMP/comparison-output/boa-build-info.json" > "$RUNNER_TEMP/comparison-output/cold.json" 2> "$RUNNER_TEMP/comparison-output/cold.progress"
      - name: Measure identical executable control and actual Boa again
        if: steps.hardware.outputs.matches == 'true'
        run: |
          node scripts/measure-regexp-cold-diagnostic.mjs "$RUNNER_TEMP/comparison-output/current-build-info.json" "$RUNNER_TEMP/comparison-output/current-build-info.json" "$RUNNER_TEMP/comparison-output/boa-build-info.json" > "$RUNNER_TEMP/comparison-output/cold-same-binary.json" 2> "$RUNNER_TEMP/comparison-output/cold-same-binary.progress"
      - name: Summarize correctness and speed gates separately
        if: always()
        run: |
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),dir=path.join(process.env.RUNNER_TEMP,'comparison-output');
          for(const name of ['cold','cold-same-binary']){try{const r=JSON.parse(fs.readFileSync(path.join(dir,name+'.json')));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,name+': checked outputs='+r.all_workloads_valid+', all three actual Boa speed comparisons='+r.all_cold_comparisons_faster_than_actual_boa+'\n');}catch{fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,name+': no complete report; unavailable hardware, errors or skipped measurement are not a speed pass.\n');}}
          JS
      - name: Retain early cold observations before macro regressions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regexp-cold-early-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.two_runners && format('-copy-{0}', matrix.copy) || '' }}
          path: ${{ runner.temp }}/comparison-output
          if-no-files-found: error
          retention-days: 30

      - name: Validate and measure warm authored RegExp inputs
        if: steps.hardware.outputs.matches == 'true'
        run: |
          node scripts/check-regexp-workloads.mjs
          node scripts/extract-regexp-workloads.mjs "$RUNNER_TEMP/regexp-workloads"
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          node scripts/compare-omoikane-workloads.mjs --regexp --temiya-baseline "$RUNNER_TEMP/regexp-workloads" "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/baseline-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/regexp-beforeafter.json" 2> "$RUNNER_TEMP/comparison-output/regexp-beforeafter.progress"
          node scripts/compare-omoikane-workloads.mjs --regexp "$RUNNER_TEMP/regexp-workloads" "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/regexp-boa.json" 2> "$RUNNER_TEMP/comparison-output/regexp-boa.progress"
      - name: Extract original eleven workloads
        if: steps.hardware.outputs.matches == 'true'
        run: |
          node scripts/extract-omoikane-workloads.mjs "$GITHUB_WORKSPACE/omoikane" "$RUNNER_TEMP/omoikane-workloads"
          cp "$RUNNER_TEMP/omoikane-workloads/manifest.json" "$RUNNER_TEMP/comparison-output/manifest.json"
      - name: Measure baseline and changed Temiya serially
        if: steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(git -c safe.directory="$GITHUB_WORKSPACE/temiya" -C "$GITHUB_WORKSPACE/temiya" rev-parse HEAD)"
          export BENCH_NOTES='GitHub hosted runner; same compiler, isolated build targets, all builds completed before timing; original eleven inputs, 15 samples and three alternating pairs. Job success means validated measurements, not a passing speed gate.'
          node scripts/compare-omoikane-workloads.mjs --temiya-baseline "$RUNNER_TEMP/omoikane-workloads" "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/baseline-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/beforeafter.json" 2> "$RUNNER_TEMP/comparison-output/beforeafter.progress"
      - name: Measure changed Temiya and actual Boa serially
        if: steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(git -c safe.directory="$GITHUB_WORKSPACE/temiya" -C "$GITHUB_WORKSPACE/temiya" rev-parse HEAD)"
          export BENCH_NOTES='GitHub hosted runner; same compiler and original pinned public application embedding; no builds during measurements. Job success means validated measurements, not a passing speed gate.'
          node scripts/compare-omoikane-workloads.mjs "$RUNNER_TEMP/omoikane-workloads" "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/boa.json" 2> "$RUNNER_TEMP/comparison-output/boa.progress"
      - name: Measure baseline and actual Boa on the same machine
        if: inputs.include_controls && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/baseline-revision.txt")"
          export BENCH_NOTES='Direct baseline/actual Boa control on this same runner; Auto Script baseline verified before timing. Original eleven inputs and unchanged statistical/limit protocol. No candidate source speedup is inferred from this control.'
          node scripts/compare-omoikane-workloads.mjs "$RUNNER_TEMP/omoikane-workloads" "$RUNNER_TEMP/temiya-baseline-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/baseline-boa.json" 2> "$RUNNER_TEMP/comparison-output/baseline-boa.progress"
      - name: Measure candidate against the identical executable
        if: inputs.include_controls && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='SAME EXECUTABLE CONTROL: identical source and SHA for both labels. Full original11/15samples/3pairs protocol diagnoses process/environment variability; any faster/slower outcome is not a source change.'
          node scripts/compare-omoikane-workloads.mjs --temiya-baseline "$RUNNER_TEMP/omoikane-workloads" "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/same-binary-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/same-binary-control.json" 2> "$RUNNER_TEMP/comparison-output/same-binary-control.progress"
      - name: Retain raw observations and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regexp-cold-final-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.two_runners && format('-copy-{0}', matrix.copy) || '' }}
          path: ${{ runner.temp }}/comparison-output
          if-no-files-found: error
          retention-days: 30
