name: Omoikane benchmark measurements

on:
  workflow_dispatch:
    inputs:
      baseline_revision:
        description: Temiya revision to compare against
        default: main
        type: string
      include_controls:
        description: Also compare baseline with Boa and candidate with itself
        default: false
        type: boolean
      include_classes:
        description: Also record fixed class4 suite (baseline must support base classes)
        default: false
        type: boolean
      include_derived:
        description: Also record fixed derived5 suite (baseline must support derived classes)
        default: false
        type: boolean
      include_super:
        description: Also record fixed super-property5 suite (baseline must support super properties)
        default: false
        type: boolean
      include_fields:
        description: Also record fixed instance-field5 suite (baseline must support public instance fields)
        default: false
        type: boolean
      include_static:
        description: Also record fixed static-element5 suite (baseline must support public static elements)
        default: false
        type: boolean
      include_private:
        description: Also record private-field5 and, when present, private-element6 suites
        default: false
        type: boolean
      two_runners:
        description: Record two independent hosted machines without selecting a CPU
        default: false
        type: boolean
      required_cpu_model:
        description: Optional CPU-model substring; unavailable hardware is not a measurement pass
        default: ''
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: omoikane-benchmark-${{ github.event.pull_request.number || github.ref }}
  # Finish active captures; queue a newer source without truncating raw data.
  cancel-in-progress: false

jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'benchmark-omoikane'
    name: Record comparisons, copy ${{ matrix.copy }} (speed gates separate)
    strategy:
      fail-fast: false
      matrix:
        copy: ${{ fromJSON(inputs.two_runners && '[1,2]' || '[1]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: temiya
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      INCLUDE_CONTROLS: ${{ inputs.include_controls || false }}
      INCLUDE_CLASSES: ${{ inputs.include_classes || false }}
      INCLUDE_DERIVED: ${{ inputs.include_derived || false }}
      INCLUDE_SUPER: ${{ inputs.include_super || false }}
      INCLUDE_FIELDS: ${{ inputs.include_fields || false }}
      INCLUDE_STATIC: ${{ inputs.include_static || false }}
      INCLUDE_PRIVATE: ${{ inputs.include_private || false }}
      REQUIRED_CPU_MODEL: ${{ inputs.required_cpu_model || '' }}
    steps:
      - name: Check out measured revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: temiya
          persist-credentials: false
      - name: Record hardware availability before building
        id: hardware
        run: |
          mkdir -p "$RUNNER_TEMP/comparison-output"
          node <<'JS'
          const fs=require('node:fs'),os=require('node:os'),path=require('node:path');
          const required=process.env.REQUIRED_CPU_MODEL ?? '';
          const models=[...new Set(os.cpus().map(c=>c.model))];
          const matches=required==='' || (models.length>0 && models.every(m=>m.includes(required)));
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'comparison-output/hardware-availability.json'),JSON.stringify({required_cpu_model:required,observed_cpu_models:models,target_available:matches,qualification:matches?'Requested hardware available; actual measurement results still required':'Requested hardware unavailable; no speed or correctness pass'},null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`matches=${matches}\n`);
          JS
      - name: Check out baseline revision
        if: steps.hardware.outputs.matches == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseline_revision || github.event.pull_request.base.sha || 'main' }}
          path: temiya-baseline
          persist-credentials: false
      - name: Check out pinned application
        if: steps.hardware.outputs.matches == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ieee0824/omoikane
          ref: 007556adccb8fb4329236932ca8175f8e8d119d2
          path: omoikane
          persist-credentials: false
      - name: Prepare compiler and output directory
        if: steps.hardware.outputs.matches == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          mkdir -p "$RUNNER_TEMP/comparison-output"
          git -c safe.directory="$GITHUB_WORKSPACE/temiya" -C "$GITHUB_WORKSPACE/temiya" rev-parse HEAD > "$RUNNER_TEMP/comparison-output/measured-revision.txt"
          git -c safe.directory="$GITHUB_WORKSPACE/temiya-baseline" -C "$GITHUB_WORKSPACE/temiya-baseline" rev-parse HEAD > "$RUNNER_TEMP/comparison-output/baseline-revision.txt"
          rustc -Vv > "$RUNNER_TEMP/comparison-output/compiler.txt"
      - name: Build both Temiya workers with isolated targets
        if: steps.hardware.outputs.matches == 'true'
        run: |
          cargo build --locked --release --no-default-features --example measure_workload --target-dir "$RUNNER_TEMP/temiya-current-target"
          cargo build --manifest-path ../temiya-baseline/Cargo.toml --locked --release --no-default-features --example measure_workload --target-dir "$RUNNER_TEMP/temiya-baseline-target"
          node <<'JS'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const path = require('node:path');
          const checkout = path.resolve('../temiya-baseline');
          const executable = path.join(process.env.RUNNER_TEMP, 'temiya-baseline-target/release/examples/measure_workload');
          const git = args => execFileSync('git', ['-c', `safe.directory=${checkout}`, '-C', checkout, ...args], { encoding: 'utf8' }).trim();
          if (git(['status', '--porcelain']) !== '') throw Error('baseline checkout changed');
          const probePath = path.join(process.env.RUNNER_TEMP, 'temiya-mode-probe.json');
          fs.writeFileSync(probePath, JSON.stringify({name:'mode-probe',setup:'',invocation:'40+2;',expected:42,iterations:1}));
          const probe = JSON.parse(execFileSync(executable, [probePath, '1'], {encoding:'utf8',timeout:60000}));
          if (!['AST interpreter','Auto Script','Auto Script+loop'].includes(probe.mode) || probe.validated_passes !== 2) throw Error('baseline mode probe failed');
          const info = {
            name: 'Temiya', engine: 'Temiya', mode: probe.mode, profile: 'release', features: [], mode_probe: probe,
            revision: git(['rev-parse', 'HEAD']), executable,
            executable_sha256: createHash('sha256').update(fs.readFileSync(executable)).digest('hex'),
            rustc: execFileSync('rustc', ['-Vv'], { encoding: 'utf8' }).trim(),
          };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'comparison-output/baseline-build-info.json'), JSON.stringify(info, null, 2) + '\n');
          if (process.env.INCLUDE_CONTROLS === 'true') {
            if (info.mode !== 'Auto Script') throw Error('optional baseline/Boa control requires an Auto Script baseline');
            const current = path.join(process.env.RUNNER_TEMP, 'temiya-current-target/release/examples/measure_workload');
            const observed = JSON.parse(execFileSync(current, [probePath, '1'], {encoding:'utf8',timeout:60000}));
            if (observed.mode !== 'Auto Script' || observed.validated_passes !== 2) throw Error('current mode probe failed');
            const source = path.resolve('.');
            const revision = execFileSync('git', ['-c', `safe.directory=${source}`, '-C', source, 'rev-parse','HEAD'], {encoding:'utf8'}).trim();
            const control = {...info, mode:observed.mode, mode_probe:observed, revision, executable:current,
              executable_sha256:createHash('sha256').update(fs.readFileSync(current)).digest('hex'),
              qualification:'Same executable used by both worker labels; this diagnoses variability, never a source speedup'};
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'comparison-output/same-binary-build-info.json'),JSON.stringify(control,null,2)+'\n');
          }
          JS
      - name: Build actual pinned omoikane embedding
        if: steps.hardware.outputs.matches == 'true'
        run: |
          node scripts/build-omoikane-worker.mjs "$GITHUB_WORKSPACE/omoikane" "$RUNNER_TEMP/omoikane-worker-build" "$RUNNER_TEMP/omoikane-worker-target"
          cp "$RUNNER_TEMP/omoikane-worker-build/build-info.json" "$RUNNER_TEMP/comparison-output/boa-build-info.json"
      - name: Extract original eleven workloads
        if: steps.hardware.outputs.matches == 'true'
        run: |
          node scripts/extract-omoikane-workloads.mjs "$GITHUB_WORKSPACE/omoikane" "$RUNNER_TEMP/omoikane-workloads"
          cp "$RUNNER_TEMP/omoikane-workloads/manifest.json" "$RUNNER_TEMP/comparison-output/manifest.json"
      - name: Measure baseline and changed Temiya serially
        if: steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(git -c safe.directory="$GITHUB_WORKSPACE/temiya" -C "$GITHUB_WORKSPACE/temiya" rev-parse HEAD)"
          export BENCH_NOTES='GitHub hosted runner; same compiler, isolated build targets, all builds completed before timing; original eleven inputs, 15 samples and three alternating pairs. Job success means validated measurements, not a passing speed gate.'
          node scripts/compare-omoikane-workloads.mjs --temiya-baseline "$RUNNER_TEMP/omoikane-workloads" "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/baseline-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/beforeafter.json" 2> "$RUNNER_TEMP/comparison-output/beforeafter.progress"
      - name: Measure changed Temiya and actual Boa serially
        if: steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(git -c safe.directory="$GITHUB_WORKSPACE/temiya" -C "$GITHUB_WORKSPACE/temiya" rev-parse HEAD)"
          export BENCH_NOTES='GitHub hosted runner; same compiler and original pinned public application embedding; no builds during measurements. Job success means validated measurements, not a passing speed gate.'
          node scripts/compare-omoikane-workloads.mjs "$RUNNER_TEMP/omoikane-workloads" "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/boa.json" 2> "$RUNNER_TEMP/comparison-output/boa.progress"
      - name: Measure baseline and actual Boa on the same machine
        if: inputs.include_controls && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/baseline-revision.txt")"
          export BENCH_NOTES='Direct baseline/actual Boa control on this same runner; Auto Script baseline verified before timing. Original eleven inputs and unchanged statistical/limit protocol. No candidate source speedup is inferred from this control.'
          node scripts/compare-omoikane-workloads.mjs "$RUNNER_TEMP/omoikane-workloads" "$RUNNER_TEMP/temiya-baseline-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/baseline-boa.json" 2> "$RUNNER_TEMP/comparison-output/baseline-boa.progress"
      - name: Measure candidate against the identical executable
        if: inputs.include_controls && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='SAME EXECUTABLE CONTROL: identical source and SHA for both labels. Full original11/15samples/3pairs protocol diagnoses process/environment variability; any faster/slower outcome is not a source change.'
          node scripts/compare-omoikane-workloads.mjs --temiya-baseline "$RUNNER_TEMP/omoikane-workloads" "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/same-binary-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/same-binary-control.json" 2> "$RUNNER_TEMP/comparison-output/same-binary-control.progress"
      - name: Measure fixed class workloads before and after
        if: inputs.include_classes && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Authored fixed class4 suite; same compiler and binary builds as original11. 15 samples/3 alternating pairs, unchanged counts/oracles/limits. No builds during timing. Baseline must support base classes. Retain every outcome.'
          node scripts/compare-class-workloads.mjs --temiya-baseline benchmarks/base-classes/class-workloads "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/baseline-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/class-beforeafter.json" 2> "$RUNNER_TEMP/comparison-output/class-beforeafter.progress"
      - name: Measure fixed class workloads against actual Boa
        if: inputs.include_classes && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Separate authored class suite, not a replacement for original11. Same compiler/host, 15 samples and 3 alternating pairs, all raw results retained. Job success is not a speed pass.'
          node scripts/compare-class-workloads.mjs benchmarks/base-classes/class-workloads "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/class-boa.json" 2> "$RUNNER_TEMP/comparison-output/class-boa.progress"
      - name: Measure class controls with the baseline and identical candidate
        if: inputs.include_classes && inputs.include_controls && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/baseline-revision.txt")"
          export BENCH_NOTES='Direct baseline/actual Boa class control on this same runner. Preserve slow and noisy outcomes.'
          node scripts/compare-class-workloads.mjs benchmarks/base-classes/class-workloads "$RUNNER_TEMP/temiya-baseline-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/class-baseline-boa.json" 2> "$RUNNER_TEMP/comparison-output/class-baseline-boa.progress"
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Same executable class control: labels do not indicate a source change. Preserve all outcomes.'
          node scripts/compare-class-workloads.mjs --temiya-baseline benchmarks/base-classes/class-workloads "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/same-binary-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/class-same-binary.json" 2> "$RUNNER_TEMP/comparison-output/class-same-binary.progress"
      - name: Independently reconstruct class measurement records
        if: inputs.include_classes && steps.hardware.outputs.matches == 'true'
        run: |
          reports=("$RUNNER_TEMP/comparison-output/class-beforeafter.json" "$RUNNER_TEMP/comparison-output/class-boa.json")
          if [ "$INCLUDE_CONTROLS" = true ]; then
            reports+=("$RUNNER_TEMP/comparison-output/class-baseline-boa.json" "$RUNNER_TEMP/comparison-output/class-same-binary.json")
          fi
          node scripts/audit-class-workload-records.mjs "${reports[@]}" > "$RUNNER_TEMP/comparison-output/class-independent-audit.json"
      - name: Measure fixed derived workloads before and after
        if: inputs.include_derived && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Authored fixed derived5 suite; same compiler and binary builds as original11. 15 samples/3 alternating pairs, unchanged counts/oracles/limits. No builds during timing. Baseline must support derived classes. Retain every outcome.'
          node scripts/compare-class-workloads.mjs --derived --temiya-baseline benchmarks/derived-classes/workloads-v1 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/baseline-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/derived-beforeafter.json" 2> "$RUNNER_TEMP/comparison-output/derived-beforeafter.progress"
      - name: Measure fixed derived workloads against actual Boa
        if: inputs.include_derived && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Separate authored class suite, not a replacement for original11. Same compiler/host, 15 samples and 3 alternating pairs, all raw results retained. Job success is not a speed pass.'
          node scripts/compare-class-workloads.mjs --derived benchmarks/derived-classes/workloads-v1 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/derived-boa.json" 2> "$RUNNER_TEMP/comparison-output/derived-boa.progress"
      - name: Measure derived controls with the baseline and identical candidate
        if: inputs.include_derived && inputs.include_controls && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/baseline-revision.txt")"
          export BENCH_NOTES='Direct baseline/actual Boa class control on this same runner. Preserve slow and noisy outcomes.'
          node scripts/compare-class-workloads.mjs --derived benchmarks/derived-classes/workloads-v1 "$RUNNER_TEMP/temiya-baseline-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/derived-baseline-boa.json" 2> "$RUNNER_TEMP/comparison-output/derived-baseline-boa.progress"
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Same executable class control: labels do not indicate a source change. Preserve all outcomes.'
          node scripts/compare-class-workloads.mjs --derived --temiya-baseline benchmarks/derived-classes/workloads-v1 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/same-binary-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/derived-same-binary.json" 2> "$RUNNER_TEMP/comparison-output/derived-same-binary.progress"
      - name: Independently reconstruct derived measurement records
        if: inputs.include_derived && steps.hardware.outputs.matches == 'true'
        run: |
          reports=("$RUNNER_TEMP/comparison-output/derived-beforeafter.json" "$RUNNER_TEMP/comparison-output/derived-boa.json")
          if [ "$INCLUDE_CONTROLS" = true ]; then
            reports+=("$RUNNER_TEMP/comparison-output/derived-baseline-boa.json" "$RUNNER_TEMP/comparison-output/derived-same-binary.json")
          fi
          node scripts/audit-class-workload-records.mjs --derived "${reports[@]}" > "$RUNNER_TEMP/comparison-output/derived-independent-audit.json"
      - name: Measure fixed super-property workloads before and after
        if: inputs.include_super && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Authored fixed super-property5 suite; same compiler and binary builds as original11. 15 samples/3 alternating pairs, unchanged counts/oracles/limits. No builds during timing. Baseline must support super properties. Retain every outcome.'
          node scripts/compare-class-workloads.mjs --super --temiya-baseline benchmarks/super-properties/workloads-v3 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/baseline-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/super-beforeafter.json" 2> "$RUNNER_TEMP/comparison-output/super-beforeafter.progress"
      - name: Measure fixed super-property workloads against actual Boa
        if: inputs.include_super && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Separate authored super-property suite, not a replacement for original11. Same compiler/host, 15 samples and 3 alternating pairs, all raw results retained. Job success is not a speed pass.'
          node scripts/compare-class-workloads.mjs --super benchmarks/super-properties/workloads-v3 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/super-boa.json" 2> "$RUNNER_TEMP/comparison-output/super-boa.progress"
      - name: Measure super-property controls with the baseline and identical candidate
        if: inputs.include_super && inputs.include_controls && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/baseline-revision.txt")"
          export BENCH_NOTES='Direct baseline/actual Boa super-property control on this same runner. Preserve slow and noisy outcomes.'
          node scripts/compare-class-workloads.mjs --super benchmarks/super-properties/workloads-v3 "$RUNNER_TEMP/temiya-baseline-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/super-baseline-boa.json" 2> "$RUNNER_TEMP/comparison-output/super-baseline-boa.progress"
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Same executable super-property control: labels do not indicate a source change. Preserve all outcomes.'
          node scripts/compare-class-workloads.mjs --super --temiya-baseline benchmarks/super-properties/workloads-v3 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/same-binary-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/super-same-binary.json" 2> "$RUNNER_TEMP/comparison-output/super-same-binary.progress"
      - name: Independently reconstruct super-property measurement records
        if: inputs.include_super && steps.hardware.outputs.matches == 'true'
        run: |
          reports=("$RUNNER_TEMP/comparison-output/super-beforeafter.json" "$RUNNER_TEMP/comparison-output/super-boa.json")
          if [ "$INCLUDE_CONTROLS" = true ]; then
            reports+=("$RUNNER_TEMP/comparison-output/super-baseline-boa.json" "$RUNNER_TEMP/comparison-output/super-same-binary.json")
          fi
          node scripts/audit-class-workload-records.mjs --super "${reports[@]}" > "$RUNNER_TEMP/comparison-output/super-independent-audit.json"
      - name: Measure fixed instance-field workloads before and after
        if: inputs.include_fields && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Authored fixed instance-field5 suite; same compiler and binary builds as original11. 15 samples/3 alternating pairs, unchanged counts/oracles/limits. No builds during timing. Baseline must support public instance fields. Retain every outcome.'
          node scripts/compare-class-workloads.mjs --fields --temiya-baseline benchmarks/instance-fields/workloads-v1 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/baseline-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/fields-beforeafter.json" 2> "$RUNNER_TEMP/comparison-output/fields-beforeafter.progress"
      - name: Measure fixed instance-field workloads against actual Boa
        if: inputs.include_fields && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Separate authored instance-field suite, not a replacement for original11. Same compiler/host, 15 samples and 3 alternating pairs, all raw results retained. Job success is not a speed pass.'
          node scripts/compare-class-workloads.mjs --fields benchmarks/instance-fields/workloads-v1 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/fields-boa.json" 2> "$RUNNER_TEMP/comparison-output/fields-boa.progress"
      - name: Measure instance-field controls with the baseline and identical candidate
        if: inputs.include_fields && inputs.include_controls && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/baseline-revision.txt")"
          export BENCH_NOTES='Direct baseline/actual Boa instance-field control on this same runner. Preserve slow and noisy outcomes.'
          node scripts/compare-class-workloads.mjs --fields benchmarks/instance-fields/workloads-v1 "$RUNNER_TEMP/temiya-baseline-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/fields-baseline-boa.json" 2> "$RUNNER_TEMP/comparison-output/fields-baseline-boa.progress"
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Same executable instance-field control: labels do not indicate a source change. Preserve all outcomes.'
          node scripts/compare-class-workloads.mjs --fields --temiya-baseline benchmarks/instance-fields/workloads-v1 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/same-binary-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/fields-same-binary.json" 2> "$RUNNER_TEMP/comparison-output/fields-same-binary.progress"
      - name: Independently reconstruct instance-field measurement records
        if: inputs.include_fields && steps.hardware.outputs.matches == 'true'
        run: |
          reports=("$RUNNER_TEMP/comparison-output/fields-beforeafter.json" "$RUNNER_TEMP/comparison-output/fields-boa.json")
          if [ "$INCLUDE_CONTROLS" = true ]; then
            reports+=("$RUNNER_TEMP/comparison-output/fields-baseline-boa.json" "$RUNNER_TEMP/comparison-output/fields-same-binary.json")
          fi
          node scripts/audit-class-workload-records.mjs --fields "${reports[@]}" > "$RUNNER_TEMP/comparison-output/fields-independent-audit.json"
      - name: Measure fixed static-element workloads before and after
        if: inputs.include_static && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Authored fixed static-element5 suite; same compiler and binary builds as original11. 15 samples/3 alternating pairs, unchanged counts/oracles/limits. No builds during timing. Baseline must support public static elements. Retain every outcome.'
          node scripts/compare-class-workloads.mjs --static --temiya-baseline benchmarks/static-class-elements/workloads-v2 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/baseline-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/static-beforeafter.json" 2> "$RUNNER_TEMP/comparison-output/static-beforeafter.progress"
      - name: Measure fixed static-element workloads against actual Boa
        if: inputs.include_static && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Separate authored static-element suite, not a replacement for original11. Same compiler/host, 15 samples and 3 alternating pairs, all raw results retained. Job success is not a speed pass.'
          node scripts/compare-class-workloads.mjs --static benchmarks/static-class-elements/workloads-v2 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/static-boa.json" 2> "$RUNNER_TEMP/comparison-output/static-boa.progress"
      - name: Measure static-element controls with the baseline and identical candidate
        if: inputs.include_static && inputs.include_controls && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/baseline-revision.txt")"
          export BENCH_NOTES='Direct baseline/actual Boa static-element control on this same runner. Preserve slow and noisy outcomes.'
          node scripts/compare-class-workloads.mjs --static benchmarks/static-class-elements/workloads-v2 "$RUNNER_TEMP/temiya-baseline-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/static-baseline-boa.json" 2> "$RUNNER_TEMP/comparison-output/static-baseline-boa.progress"
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Same executable static-element control: labels do not indicate a source change. Preserve all outcomes.'
          node scripts/compare-class-workloads.mjs --static --temiya-baseline benchmarks/static-class-elements/workloads-v2 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/same-binary-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/static-same-binary.json" 2> "$RUNNER_TEMP/comparison-output/static-same-binary.progress"
      - name: Independently reconstruct static-element measurement records
        if: inputs.include_static && steps.hardware.outputs.matches == 'true'
        run: |
          reports=("$RUNNER_TEMP/comparison-output/static-beforeafter.json" "$RUNNER_TEMP/comparison-output/static-boa.json")
          if [ "$INCLUDE_CONTROLS" = true ]; then
            reports+=("$RUNNER_TEMP/comparison-output/static-baseline-boa.json" "$RUNNER_TEMP/comparison-output/static-same-binary.json")
          fi
          node scripts/audit-class-workload-records.mjs --static "${reports[@]}" > "$RUNNER_TEMP/comparison-output/static-independent-audit.json"
      - name: Measure fixed private-field workloads before and after
        if: inputs.include_private && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Authored fixed private-field5 suite; same compiler and binary builds as original11. 15 samples/3 alternating pairs, unchanged counts/oracles/limits. No builds during timing. Baseline must support private instance fields. Retain every outcome.'
          node scripts/compare-class-workloads.mjs --private --temiya-baseline benchmarks/private-fields/workloads-v1 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/baseline-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/private-beforeafter.json" 2> "$RUNNER_TEMP/comparison-output/private-beforeafter.progress"
      - name: Measure fixed private-field workloads against actual Boa
        if: inputs.include_private && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Separate authored private-field suite, not a replacement for original11. Same compiler/host, 15 samples and 3 alternating pairs, all raw results retained. Job success is not a speed pass.'
          node scripts/compare-class-workloads.mjs --private benchmarks/private-fields/workloads-v1 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/private-boa.json" 2> "$RUNNER_TEMP/comparison-output/private-boa.progress"
      - name: Measure private-field controls with the baseline and identical candidate
        if: inputs.include_private && inputs.include_controls && steps.hardware.outputs.matches == 'true'
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/baseline-revision.txt")"
          export BENCH_NOTES='Direct baseline/actual Boa private-field control on this same runner. Preserve slow and noisy outcomes.'
          node scripts/compare-class-workloads.mjs --private benchmarks/private-fields/workloads-v1 "$RUNNER_TEMP/temiya-baseline-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/private-baseline-boa.json" 2> "$RUNNER_TEMP/comparison-output/private-baseline-boa.progress"
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Same executable private-field control: labels do not indicate a source change. Preserve all outcomes.'
          node scripts/compare-class-workloads.mjs --private --temiya-baseline benchmarks/private-fields/workloads-v1 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/same-binary-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/private-same-binary.json" 2> "$RUNNER_TEMP/comparison-output/private-same-binary.progress"
      - name: Independently reconstruct private-field measurement records
        if: inputs.include_private && steps.hardware.outputs.matches == 'true'
        run: |
          reports=("$RUNNER_TEMP/comparison-output/private-beforeafter.json" "$RUNNER_TEMP/comparison-output/private-boa.json")
          if [ "$INCLUDE_CONTROLS" = true ]; then
            reports+=("$RUNNER_TEMP/comparison-output/private-baseline-boa.json" "$RUNNER_TEMP/comparison-output/private-same-binary.json")
          fi
          node scripts/audit-class-workload-records.mjs --private "${reports[@]}" > "$RUNNER_TEMP/comparison-output/private-independent-audit.json"
      - name: Measure fixed private-element workloads against actual Boa
        if: inputs.include_private && steps.hardware.outputs.matches == 'true' && hashFiles('temiya/benchmarks/private-elements/workloads-v1/manifest.json') != ''
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Six private-element workloads frozen before implementation. Actual Boa comparison; unchanged15 samples/3 alternating pairs and watchdog/noise policy. A successful job is not a speed pass. Baseline source predates this feature; no successful before/after comparison is claimed.'
          node scripts/compare-class-workloads.mjs --elements benchmarks/private-elements/workloads-v1 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/boa-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/elements-boa.json" 2> "$RUNNER_TEMP/comparison-output/elements-boa.progress"
      - name: Measure identical candidate private-element control
        if: inputs.include_private && inputs.include_controls && steps.hardware.outputs.matches == 'true' && hashFiles('temiya/benchmarks/private-elements/workloads-v1/manifest.json') != ''
        run: |
          export TEMIYA_REVISION="$(cat "$RUNNER_TEMP/comparison-output/measured-revision.txt")"
          export BENCH_NOTES='Identical executable private-element control. Retain every slow/noisy outcome. Labels do not indicate a source improvement.'
          node scripts/compare-class-workloads.mjs --elements --temiya-baseline benchmarks/private-elements/workloads-v1 "$RUNNER_TEMP/temiya-current-target/release/examples/measure_workload" "$RUNNER_TEMP/comparison-output/same-binary-build-info.json" 15 3 > "$RUNNER_TEMP/comparison-output/elements-same-binary.json" 2> "$RUNNER_TEMP/comparison-output/elements-same-binary.progress"
      - name: Independently reconstruct private-element measurement records
        if: inputs.include_private && steps.hardware.outputs.matches == 'true' && hashFiles('temiya/benchmarks/private-elements/workloads-v1/manifest.json') != ''
        run: |
          reports=("$RUNNER_TEMP/comparison-output/elements-boa.json")
          if [ "$INCLUDE_CONTROLS" = true ]; then
            reports+=("$RUNNER_TEMP/comparison-output/elements-same-binary.json")
          fi
          node scripts/audit-class-workload-records.mjs --elements "${reports[@]}" > "$RUNNER_TEMP/comparison-output/elements-independent-audit.json"
      - name: Summarize validity and speed gates separately
        if: always()
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const lines = ['## Measurement results', '', 'A successful job records correct benchmark outputs; it does not mean Temiya is faster.', ''];
          const availability = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'comparison-output/hardware-availability.json')));
          if (!availability.target_available) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Requested CPU unavailable. Measurements were not run and do not count as a correctness or speed pass.\n');
            process.exit(0);
          }
          const names = ['beforeafter','boa',...(process.env.INCLUDE_CONTROLS === 'true' ? ['baseline-boa','same-binary-control'] : [])];
          for (const name of names) {
            try {
              const r = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'comparison-output', `${name}.json`)));
              const field = name.endsWith('boa') ? 'all_eleven_workloads_faster_beyond_threshold' : 'all_eleven_workloads_after_faster_beyond_threshold';
              lines.push(`- ${name}: correct outputs = ${r.all_workloads_valid}; all-eleven speed gate = ${r[field]}`);
              if (name === 'same-binary-control') lines.push('  Identical executable control; faster/slower labels are variability observations, not a code improvement.');
            } catch {
              lines.push(`- ${name}: no complete measurement report; inspect logs and artifacts.`);
            }
          }
          if (process.env.INCLUDE_PRIVATE === 'true' && fs.existsSync('benchmarks/private-elements/workloads-v1/manifest.json')) {
            for (const name of ['elements-boa', ...(process.env.INCLUDE_CONTROLS === 'true' ? ['elements-same-binary'] : [])]) {
              try {
                const r = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'comparison-output', name + '.json')));
                lines.push('- ' + name + ': correct outputs = ' + r.all_workloads_valid + '; all-private-element speed gate = ' + r.all_class_workloads_faster_beyond_threshold);
              } catch { lines.push('- ' + name + ': no complete measurement report.'); }
            }
            lines.push('Private-element baseline before/after is not measured: the selected parent baseline predates this feature.');
          }
          if (process.env.INCLUDE_CLASSES === 'true') {
            const classes = ['class-beforeafter', 'class-boa', ...(process.env.INCLUDE_CONTROLS === 'true' ? ['class-baseline-boa', 'class-same-binary'] : [])];
            for (const name of classes) {
              try {
                const r = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'comparison-output', name + '.json')));
                lines.push('- ' + name + ': correct outputs = ' + r.all_workloads_valid + '; all-class speed gate = ' + r.all_class_workloads_faster_beyond_threshold);
              } catch { lines.push('- ' + name + ': no complete measurement report.'); }
            }
          }
          if (process.env.INCLUDE_DERIVED === 'true') {
            const classes = ['derived-beforeafter', 'derived-boa', ...(process.env.INCLUDE_CONTROLS === 'true' ? ['derived-baseline-boa', 'derived-same-binary'] : [])];
            for (const name of classes) {
              try {
                const r = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'comparison-output', name + '.json')));
                lines.push('- ' + name + ': correct outputs = ' + r.all_workloads_valid + '; all-derived speed gate = ' + r.all_class_workloads_faster_beyond_threshold);
              } catch { lines.push('- ' + name + ': no complete measurement report.'); }
            }
          }
          if (process.env.INCLUDE_SUPER === 'true') {
            const classes = ['super-beforeafter', 'super-boa', ...(process.env.INCLUDE_CONTROLS === 'true' ? ['super-baseline-boa', 'super-same-binary'] : [])];
            for (const name of classes) {
              try {
                const r = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'comparison-output', name + '.json')));
                lines.push('- ' + name + ': correct outputs = ' + r.all_workloads_valid + '; all-super speed gate = ' + r.all_class_workloads_faster_beyond_threshold);
              } catch { lines.push('- ' + name + ': no complete measurement report.'); }
            }
          }
          if (process.env.INCLUDE_FIELDS === 'true') {
            const classes = ['fields-beforeafter', 'fields-boa', ...(process.env.INCLUDE_CONTROLS === 'true' ? ['fields-baseline-boa', 'fields-same-binary'] : [])];
            for (const name of classes) {
              try {
                const r = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'comparison-output', name + '.json')));
                lines.push('- ' + name + ': correct outputs = ' + r.all_workloads_valid + '; all-fields speed gate = ' + r.all_class_workloads_faster_beyond_threshold);
              } catch { lines.push('- ' + name + ': no complete measurement report.'); }
            }
          }
          if (process.env.INCLUDE_STATIC === 'true') {
            const classes = ['static-beforeafter', 'static-boa', ...(process.env.INCLUDE_CONTROLS === 'true' ? ['static-baseline-boa', 'static-same-binary'] : [])];
            for (const name of classes) {
              try {
                const r = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'comparison-output', name + '.json')));
                lines.push('- ' + name + ': correct outputs = ' + r.all_workloads_valid + '; all-static speed gate = ' + r.all_class_workloads_faster_beyond_threshold);
              } catch { lines.push('- ' + name + ': no complete measurement report.'); }
            }
          }
          if (process.env.INCLUDE_PRIVATE === 'true') {
            const classes = ['private-beforeafter', 'private-boa', ...(process.env.INCLUDE_CONTROLS === 'true' ? ['private-baseline-boa', 'private-same-binary'] : [])];
            for (const name of classes) {
              try {
                const r = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'comparison-output', name + '.json')));
                lines.push('- ' + name + ': correct outputs = ' + r.all_workloads_valid + '; all-private speed gate = ' + r.all_class_workloads_faster_beyond_threshold);
              } catch { lines.push('- ' + name + ': no complete measurement report.'); }
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          JS
      - name: Retain raw observations and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omoikane-comparison-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.two_runners && format('-copy-{0}', matrix.copy) || '' }}
          path: ${{ runner.temp }}/comparison-output
          if-no-files-found: error
          retention-days: 30
