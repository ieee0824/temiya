name: Security and undefined behavior

on:
  pull_request:
    paths:
      - .github/workflows/security.yml
      - Cargo.lock
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install pinned cargo-audit
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - name: Reject vulnerable or unmaintained dependencies
        run: cargo +stable audit --deny warnings

  miri:
    name: Miri library tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned nightly with Miri
        run: rustup toolchain install nightly-2026-10-20 --profile minimal --component miri
      - name: Prepare Miri sysroot
        run: cargo +nightly-2026-10-20 miri setup
      - name: Check library tests under Miri
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check
        run: cargo +nightly-2026-10-20 miri test --lib

  address-sanitizer:
    name: AddressSanitizer integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-10-20 --profile minimal
      - name: Run integration tests with AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
        run: cargo +nightly-2026-10-20 test --tests --target x86_64-unknown-linux-gnu
