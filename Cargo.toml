[package]
name = "temiya"
version = "0.1.0"
edition = "2024"
description = "A Rust-native JavaScript engine"
rust-version = "1.85"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
jit = ["dep:libc"]

[dependencies]
libc = { version = "0.2.177", optional = true }
num-bigint = "0.5.1"
regex = { version = "1.11.1", default-features = false, features = ["std", "unicode"] }
serde_json = "1.0.145"
ryu-js = "1.0.3"
unicode-id-start = "1.5.0"

[[bench]]
name = "baseline"
harness = false
